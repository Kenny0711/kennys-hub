        <circle cx="96" cy="134" r="1.5" fill="#e0f2fe"/><circle cx="164" cy="112" r="1.4" fill="#fff7ed"/>
      </g>
      <text x="23" y="268" fill="#cffafe" font-family="Cascadia Code, Consolas, monospace" font-size="21" font-weight="700">denoised image</text>
    </g>

    <g transform="translate(876 0)">
