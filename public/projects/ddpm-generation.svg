    <clipPath id="clip2"><rect x="292" y="0" width="220" height="220" rx="26"/></clipPath>
    <clipPath id="clip3"><rect x="584" y="0" width="220" height="220" rx="26"/></clipPath>
    <clipPath id="clip4"><rect x="876" y="0" width="220" height="220" rx="26"/></clipPath>
