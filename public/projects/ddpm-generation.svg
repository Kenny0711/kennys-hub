          <circle cx="480" cy="32" r="1.7" fill="#34d399"/><circle cx="326" cy="112" r="1.8" fill="#fb7185"/><circle cx="369" cy="150" r="1.5" fill="#60a5fa"/><circle cx="409" cy="118" r="1.9" fill="#f97316"/>
