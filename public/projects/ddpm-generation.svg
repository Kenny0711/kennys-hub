<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Conditional DDPM denoising sequence from RGB noise to iCLEVR 3D objects">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#020617"/>
      <stop offset=".42" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset=".62" stop-color="#050814"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cubeFront" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#67e8f9"/>
      <stop offset=".55" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#cffafe"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="cubeSide" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0891b2"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <radialGradient id="sphere" cx="32%" cy="26%" r="70%">
      <stop stop-color="#fecaca"/>
      <stop offset=".25" stop-color="#f87171"/>
      <stop offset=".68" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="sphereFaint" cx="35%" cy="28%" r="72%">
