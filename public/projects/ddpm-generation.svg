      <stop offset=".55" stop-color="#ef4444" stop-opacity=".42"/>
      <stop offset="1" stop-color="#7f1d1d" stop-opacity=".22"/>
    </radialGradient>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22d3ee" flood-opacity=".65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#0e7490" flood-opacity=".42"/>
    </filter>
    <filter id="redGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f87171" flood-opacity=".7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#991b1b" flood-opacity=".45"/>
    </filter>
    <filter id="labelGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#38bdf8" flood-opacity=".55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#ef4444" flood-opacity=".2"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
