        <path d="M50 126l29-27h76l-29 27z" fill="url(#cubeTop)" stroke="#ecfeff" stroke-width="3.5"/>
        <path d="M126 126l29-27v66l-29 27z" fill="url(#cubeSide)" stroke="#a5f3fc" stroke-width="3.5"/>
        <path d="M66 139h38M66 156h38" stroke="#cffafe" stroke-opacity=".45" stroke-width="2"/>
