          <circle cx="95" cy="128" r="2.4" fill="#38bdf8"/><circle cx="121" cy="98" r="2" fill="#f472b6"/><circle cx="146" cy="122" r="2.5" fill="#c084fc"/><circle cx="176" cy="96" r="1.8" fill="#f87171"/>
