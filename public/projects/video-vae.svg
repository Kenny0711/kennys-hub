    <rect x="34" y="34" width="180" height="48" rx="16" fill="#312e81" fill-opacity=".72" stroke="#c4b5fd" stroke-opacity=".35"/>
    <text x="58" y="65" fill="#ede9fe" font-family="Cascadia Code, Consolas, monospace" font-size="20" font-weight="700">Condition (Pose)</text>

    <g transform="translate(74 104)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <g stroke="#67e8f9" stroke-width="7" opacity=".86">
        <path d="M80 58l-34 72M80 58l46 68M80 58l0 82M80 140l-42 86M80 140l52 86M80 140l-4 72"/>
