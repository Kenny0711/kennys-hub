      <g fill="#e0f2fe">
        <circle class="node" cx="80" cy="30" r="13"/>
        <circle class="node delay-1" cx="80" cy="58" r="9"/>
        <circle class="node delay-2" cx="46" cy="130" r="9"/>
        <circle class="node" cx="126" cy="126" r="9"/>
        <circle class="node delay-1" cx="80" cy="140" r="10"/>
        <circle class="node delay-2" cx="38" cy="226" r="9"/>
        <circle class="node" cx="132" cy="226" r="9"/>
        <circle class="node delay-1" cx="28" cy="184" r="8"/>
        <circle class="node delay-2" cx="150" cy="176" r="8"/>
      </g>
    </g>
  </g>

  <g>
    <path class="flow" d="M414 306h118" fill="none" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)" opacity=".78"/>
    <path class="flow" d="M668 306h118" fill="none" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)" opacity=".78"/>
  </g>

  <g class="latent-ring" filter="url(#glow)">
    <ellipse cx="600" cy="306" rx="104" ry="122" fill="url(#latent)"/>
    <path d="M540 306c28-58 92-58 120 0-28 58-92 58-120 0Z" fill="none" stroke="#e9d5ff" stroke-width="5" opacity=".62"/>
    <path d="M600 206c64 58 64 142 0 200-64-58-64-142 0-200Z" fill="none" stroke="#a78bfa" stroke-width="4" opacity=".42"/>
    <text x="548" y="314" fill="#f5f3ff" font-family="Cascadia Code, Consolas, monospace" font-size="24" font-weight="700">latent z</text>
  </g>

  <g transform="translate(792 116)" filter="url(#glow)">
    <rect width="300" height="350" rx="30" fill="#020617" stroke="#c4b5fd" stroke-opacity=".25"/>
    <text x="44" y="58" fill="#ddd6fe" font-family="Cascadia Code, Consolas, monospace" font-size="22" font-weight="700">future frames</text>

    <g class="ghost-a" transform="translate(46 88)" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="#a78bfa">
