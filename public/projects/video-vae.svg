<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Conditional VAE video prediction skeleton cover">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#080b16"/>
      <stop offset=".52" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="latent" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c084fc" stop-opacity=".72"/>
      <stop offset=".45" stop-color="#7c3aed" stop-opacity=".34"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4z" fill="#ddd6fe"/>
    </marker>
    <style>
      .node { animation: pulse 2.6s ease-in-out infinite; }
      .node.delay-1 { animation-delay: .35s; }
      .node.delay-2 { animation-delay: .7s; }
      .flow { stroke-dasharray: 14 16; animation: dash 2.8s linear infinite; }
      .ghost-a { animation: ghost 3.2s ease-in-out infinite; }
      .ghost-b { animation: ghost 3.2s ease-in-out infinite .55s; }
      .latent-ring { animation: breathe 3.4s ease-in-out infinite; transform-origin: 600px 330px; }
      @keyframes pulse { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
      @keyframes dash { to { stroke-dashoffset: -60; } }
      @keyframes ghost { 0%,100% { opacity: .28; } 50% { opacity: .58; } }
      @keyframes breathe { 0%,100% { transform: scale(.96); opacity: .68; } 50% { transform: scale(1.04); opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity=".12" stroke="#ddd6fe">
    <path d="M0 112h1200M0 224h1200M0 336h1200M0 448h1200M0 560h1200"/>
    <path d="M120 0v675M240 0v675M360 0v675M480 0v675M600 0v675M720 0v675M840 0v675M960 0v675M1080 0v675"/>
  </g>

  <g transform="translate(110 118)">
