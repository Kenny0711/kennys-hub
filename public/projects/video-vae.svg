      <circle cx="30" cy="176" r="7"/><circle cx="100" cy="174" r="7"/><circle cx="120" cy="98" r="7"/>
    </g>

    <g class="ghost-b" transform="translate(102 96)" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="#c4b5fd" opacity=".45">
      <circle cx="82" cy="28" r="12"/>
      <path d="M82 50l-8 70M82 50l54 34M74 120l-18 78M74 120l58 42"/>
      <circle cx="56" cy="198" r="7"/><circle cx="132" cy="162" r="7"/><circle cx="136" cy="84" r="7"/>
    </g>

    <g transform="translate(156 108)" stroke="#e9d5ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="#e9d5ff">
