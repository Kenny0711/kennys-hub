      <path d="M84 52l16 70M84 52l54 52M100 122l-8 86M100 122l70 54"/>
      <circle class="node delay-1" cx="92" cy="208" r="8"/><circle class="node delay-2" cx="170" cy="176" r="8"/><circle class="node" cx="138" cy="104" r="8"/>
    </g>
  </g>

  <text x="94" y="606" fill="#ede9fe" font-family="Cascadia Code, Consolas, monospace" font-size="54" font-weight="700">Conditional VAE Video Prediction</text>
</svg>
