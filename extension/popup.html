<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>LC Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e2e8f0;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #22c55e;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 10px;
      color: #000;
      flex-shrink: 0;
    }
    h1 { font-size: 14px; font-weight: 700; }
    .status {
      padding: 8px 10px;
      border-radius: 7px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      margin-bottom: 12px;
      font-size: 12px;
      color: #94a3b8;
    }
    label {
      display: block;
      font-size: 10px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 4px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 7px;
      color: #e2e8f0;
      font-size: 12px;
      outline: none;
      margin-bottom: 10px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #3a3a3a; }
    input::placeholder { color: #334155; }
    button {
      width: 100%;
      padding: 9px;
      background: #22c55e;
      color: #000;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover:not(:disabled) { opacity: 0.88; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .result {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 7px;
      background: #1a1a1a;
      border: 1px solid #1e1e1e;
      font-size: 12px;
      min-height: 34px;
      color: #475569;
      word-break: break-all;
      line-height: 1.5;
    }
    .divider {
      border: none;
      border-top: 1px solid #1e1e1e;
      margin: 14px 0;
    }
    #import-btn {
      background: #1d4ed8;
      font-size: 12px;
    }
    #import-btn:hover:not(:disabled) { background: #1e40af; opacity: 1; }
    #import-progress {
      display: none;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 7px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .progress-bar-wrap {
      height: 3px;
      background: #2a2a2a;
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: #1d4ed8;
      border-radius: 2px;
      width: 0%;
      transition: width 0.2s;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">LC</div>
    <h1>LC Tracker</h1>
  </div>

  <div id="status" class="status">偵測中...</div>

  <label>Webhook URL</label>
  <input id="webhook-url" type="text" placeholder="https://n8n.example.com/webhook/..." />

  <label>Secret（可選）</label>
  <input id="webhook-secret" type="password" placeholder="WEBHOOK_SECRET" />

  <button id="capture-btn" disabled>擷取並送出</button>

  <div id="result" class="result">等待操作...</div>

  <hr class="divider" />

  <button id="import-btn">📥 匯入 LeetCode 歷史解題</button>
  <div id="import-progress">
    <span id="import-msg">準備中...</span>
    <div class="progress-bar-wrap">
      <div id="progress-bar"></div>
    </div>
  </div>

  <button id="tags-btn" style="margin-top:8px; background:#065f46;">🏷️ 補全所有題目 Tags</button>
  <div id="tags-progress" style="display:none; margin-top:8px; padding:8px 10px; border-radius:7px; background:#1a1a1a; border:1px solid #2a2a2a; font-size:12px; color:#94a3b8; line-height:1.5;">
    <span id="tags-msg">準備中...</span>
    <div class="progress-bar-wrap">
      <div id="tags-bar" style="height:100%; background:#059669; border-radius:2px; width:0%; transition:width 0.2s;"></div>
    </div>
  </div>

  <script src="dist/popup.js"></script>
</body>
</html>
